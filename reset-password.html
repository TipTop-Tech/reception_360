<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reception 360 — Reset password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f4f5f7;
      --color-background-info: #eff6ff;
      --color-background-success: #f0fdf4;
      --color-background-danger: #fef2f2;
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --color-text-tertiary: #9ca3af;
      --color-text-info: #2563eb;
      --color-text-success: #16a34a;
      --color-text-danger: #dc2626;
      --color-border-primary: #e5e7eb;
      --color-border-secondary: #d1d5db;
      --color-border-tertiary: #f3f4f6;
      --color-accent: #2563eb;
      --border-radius-sm: 6px;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--color-background-secondary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-primary);
      border-radius: var(--border-radius-lg);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 0.5px solid var(--color-border-primary);
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      border-radius: var(--border-radius-md);
      background: var(--color-background-info);
      color: var(--color-text-info);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon i { font-size: 17px; }

    .logo-text { line-height: 1.2; }
    .logo-text .name { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); }
    .logo-text .sub { font-size: 11.5px; color: var(--color-text-tertiary); }

    .card-body { padding: 24px 20px 20px; }

    .heading { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
    .subheading { font-size: 12.5px; color: var(--color-text-secondary); margin-bottom: 20px; line-height: 1.5; }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 5px;
    }

    .input-wrap { position: relative; }

    .input-wrap i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--color-text-tertiary);
      pointer-events: none;
    }

    .field input {
      width: 100%;
      padding: 8px 10px 8px 34px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      font-size: 13px;
      color: var(--color-text-primary);
      background: var(--color-background-primary);
      outline: none;
      transition: border-color 0.12s;
    }

    .field input::placeholder { color: var(--color-text-tertiary); }

    .field input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }

    .message-box {
      display: none;
      font-size: 12px;
      border-radius: var(--border-radius-sm);
      padding: 8px 10px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .message-box.error {
      display: block;
      color: var(--color-text-danger);
      background: var(--color-background-danger);
    }

    .message-box.success {
      display: block;
      color: var(--color-text-success);
      background: var(--color-background-success);
    }

    .btn-primary {
      width: 100%;
      padding: 9px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--border-radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s;
    }

    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    .text-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--color-text-info);
      text-decoration: none;
    }

    .text-link:hover { text-decoration: underline; }

    .card-footer {
      padding: 12px 20px;
      border-top: 0.5px solid var(--color-border-tertiary);
      font-size: 11.5px;
      color: var(--color-text-tertiary);
      text-align: center;
    }

    /* ── Password Requirements List ── */
    .requirements {
      margin-top: -4px;
      margin-bottom: 14px;
      font-size: 11.5px;
      list-style: none;
      padding-left: 2px;
    }

    .requirements li {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      color: var(--color-text-tertiary);
    }

    .requirements li i { font-size: 12px; }

    .requirements li.valid { color: var(--color-text-success); }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="card-header">
    <div class="logo-icon"><i class="ti ti-headset"></i></div>
    <div class="logo-text">
      <div class="name">Reception 360</div>
      <div class="sub">Riverside Family Health</div>
    </div>
  </div>

  <!-- Body -->
  <div class="card-body">
    <p class="heading">Choose a new password</p>
    <p class="subheading">Pick something you haven't used here before.</p>

    <div id="form-area">
      <!-- New password -->
      <div class="field">
        <label for="password">New password</label>
        <div class="input-wrap">
          <i class="ti ti-lock"></i>
          <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" oninput="validatePassword()" />
        </div>
      </div>

      <!-- Password Requirements Tracker -->
      <ul class="requirements">
        <li id="req-length"><i class="ti ti-circle-x"></i> At least 7 characters long</li>
        <li id="req-letter"><i class="ti ti-circle-x"></i> Includes at least one letter</li>
        <li id="req-number"><i class="ti ti-circle-x"></i> Includes at least one number</li>
        <li id="req-capital"><i class="ti ti-circle-x"></i> Includes one capital (uppercase) letter</li>
      </ul>

      <!-- Confirm password -->
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <div class="input-wrap">
          <i class="ti ti-lock-check"></i>
          <input id="confirm" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div class="message-box" id="message-box"></div>

    <!-- Submit -->
    <button class="btn-primary" id="submit-btn" onclick="handleReset()">Reset password</button>

    <a href="login.html" class="text-link">Back to log in</a>
  </div>

  <!-- Footer -->
  <div class="card-footer">Reception 360 · Password reset</div>

</div>

<script>
  const token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    document.getElementById('form-area').style.display = 'none';
    document.getElementById('submit-btn').style.display = 'none';
    showMessage('This reset link is missing or broken. Please request a new one from the "Forgot password?" page.', 'error');
  }

  function validatePassword() {
    const password = document.getElementById('password').value;

    const conditions = {
      length: password.length >= 7,
      letter: /[a-zA-Z]/.test(password),
      number: /[0-9]/.test(password),
      capital: /[A-Z]/.test(password)
    };

    updateRequirementUI('req-length', conditions.length);
    updateRequirementUI('req-letter', conditions.letter);
    updateRequirementUI('req-number', conditions.number);
    updateRequirementUI('req-capital', conditions.capital);

    return conditions.length && conditions.letter && conditions.number && conditions.capital;
  }

  function updateRequirementUI(elementId, isValid) {
    const element = document.getElementById(elementId);
    const icon = element.querySelector('i');

    if (isValid) {
      element.classList.add('valid');
      icon.className = 'ti ti-checkbox';
    } else {
      element.classList.remove('valid');
      icon.className = 'ti ti-circle-x';
    }
  }

  async function handleReset() {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const btn = document.getElementById('submit-btn');

    if (!validatePassword()) {
      showMessage('Please make sure your password meets all requirements.', 'error');
      return;
    }

    if (password !== confirm) {
      showMessage("The two passwords don't match.", 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const response = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || 'Could not reset your password.');
      }

      document.getElementById('form-area').style.display = 'none';
      btn.style.display = 'none';
      showMessage('Password updated! Redirecting you to log in…', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    } catch (error) {
      showMessage(error.message || 'Something went wrong. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Reset password';
    }
  }

  function showMessage(text, type) {
    const msgBox = document.getElementById('message-box');
    msgBox.textContent = text;
    msgBox.className = `message-box ${type}`;
  }

  // Allow pressing Enter to submit
  document.addEventListener('keydown', e => {
    const btn = document.getElementById('submit-btn');
    if (e.key === 'Enter' && token && !btn.disabled) handleReset();
  });
</script>

</body>
</html>

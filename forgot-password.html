<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reception 360 — Forgot password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f4f5f7;
      --color-background-info: #eff6ff;
      --color-background-success: #f0fdf4;
      --color-background-danger: #fef2f2;
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --color-text-tertiary: #9ca3af;
      --color-text-info: #2563eb;
      --color-text-success: #16a34a;
      --color-text-danger: #dc2626;
      --color-border-primary: #e5e7eb;
      --color-border-secondary: #d1d5db;
      --color-border-tertiary: #f3f4f6;
      --color-accent: #2563eb;
      --border-radius-sm: 6px;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--color-background-secondary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-primary);
      border-radius: var(--border-radius-lg);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 0.5px solid var(--color-border-primary);
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      border-radius: var(--border-radius-md);
      background: var(--color-background-info);
      color: var(--color-text-info);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon i { font-size: 17px; }

    .logo-text { line-height: 1.2; }
    .logo-text .name { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); }
    .logo-text .sub { font-size: 11.5px; color: var(--color-text-tertiary); }

    .card-body { padding: 24px 20px 20px; }

    .heading { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
    .subheading { font-size: 12.5px; color: var(--color-text-secondary); margin-bottom: 20px; line-height: 1.5; }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 5px;
    }

    .input-wrap { position: relative; }

    .input-wrap i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--color-text-tertiary);
      pointer-events: none;
    }

    .field input {
      width: 100%;
      padding: 8px 10px 8px 34px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      font-size: 13px;
      color: var(--color-text-primary);
      background: var(--color-background-primary);
      outline: none;
      transition: border-color 0.12s;
    }

    .field input::placeholder { color: var(--color-text-tertiary); }

    .field input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }

    .message-box {
      display: none;
      font-size: 12px;
      border-radius: var(--border-radius-sm);
      padding: 8px 10px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .message-box.error {
      display: block;
      color: var(--color-text-danger);
      background: var(--color-background-danger);
    }

    .message-box.success {
      display: block;
      color: var(--color-text-success);
      background: var(--color-background-success);
    }

    .btn-primary {
      width: 100%;
      padding: 9px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--border-radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s;
    }

    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    .text-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--color-text-info);
      text-decoration: none;
    }

    .text-link:hover { text-decoration: underline; }

    .card-footer {
      padding: 12px 20px;
      border-top: 0.5px solid var(--color-border-tertiary);
      font-size: 11.5px;
      color: var(--color-text-tertiary);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="card-header">
    <div class="logo-icon"><i class="ti ti-headset"></i></div>
    <div class="logo-text">
      <div class="name">Reception 360</div>
      <div class="sub">Riverside Family Health</div>
    </div>
  </div>

  <!-- Body -->
  <div class="card-body">
    <p class="heading">Forgot your password?</p>
    <p class="subheading">Enter the email you signed up with and we'll send you a link to reset it.</p>

    <!-- Email -->
    <div class="field">
      <label for="email">Email</label>
      <div class="input-wrap">
        <i class="ti ti-mail"></i>
        <input id="email" type="email" placeholder="you@clinic.com" autocomplete="email" />
      </div>
    </div>

    <!-- Messages -->
    <div class="message-box" id="message-box"></div>

    <!-- Submit -->
    <button class="btn-primary" id="submit-btn" onclick="handleForgot()">Send reset link</button>

    <a href="login.html" class="text-link">Back to log in</a>
  </div>

  <!-- Footer -->
  <div class="card-footer">Reception 360 · Password reset</div>

</div>

<script>
  async function handleForgot() {
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('submit-btn');

    if (!email || !email.includes('@')) {
      showMessage('Please enter a valid email address.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const response = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || 'Something went wrong.');
      }

      showMessage(data.message + ' Check your inbox (and spam folder). The link expires in 30 minutes.', 'success');
      btn.textContent = 'Link sent';
    } catch (error) {
      showMessage(error.message || 'Something went wrong. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  }

  function showMessage(text, type) {
    const msgBox = document.getElementById('message-box');
    msgBox.textContent = text;
    msgBox.className = `message-box ${type}`;
  }

  // Allow pressing Enter to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !document.getElementById('submit-btn').disabled) handleForgot();
  });
</script>

</body>
</html>
